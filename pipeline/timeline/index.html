<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>FORM 宣传片时间轴 · seek(t)</title>
<style>
  :root { --bg:#11171a; --s2:#1b2327; --line:#2a3438; --text:#e5e7e2; --muted:#869296; --accent:#d18d5f; --soft:#e8b28a; --cage:#e07a3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  body { width: 1920px; height: 1080px; font-family: "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  /* 画面区:字幕条以上。浏览器窗口、示意动画、包装文字都只在这里,字幕永远不压画面 */
  #view { position: absolute; left: 0; top: 0; width: 1920px; height: 948px; overflow: hidden; background:
    radial-gradient(1300px 760px at 82% 8%, rgba(209,141,95,.17), transparent 62%),
    radial-gradient(900px 600px at 4% 100%, rgba(232,178,138,.07), transparent 60%),
    linear-gradient(rgba(159,175,177,.045) 1px, transparent 1px) 0 0 / 100% 54px,
    linear-gradient(90deg, rgba(159,175,177,.045) 1px, transparent 1px) 0 0 / 54px 100%, var(--bg); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 948px; }
  #band { position: absolute; left: 0; top: 948px; width: 1920px; height: 132px; background: #0b1012; border-top: 1px solid #222c30; }
  #cap { position: absolute; left: 96px; top: 0; width: 1728px; height: 108px; display: flex; align-items: center; justify-content: center; white-space: nowrap; font-weight: 700; font-size: 44px; letter-spacing: .05em; color: #f3f4f0; }
  #captxt b { font-weight: 900; color: var(--soft); }
  #bgclip { transform-origin: 50% 50%; }
  #scrim { background: radial-gradient(1200px 640px at 50% 50%, rgba(8,11,13,.42), rgba(8,11,13,.84)); }
  svg path, svg polyline, svg line, svg circle, svg polygon, svg rect { vector-effect: non-scaling-stroke; }
  svg text { font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
  #cam { transform-origin: 0 0; will-change: transform, filter; }
  #win { position: absolute; left: 171px; top: 10px; width: 1578px; border-radius: 16px; overflow: hidden; background: #151c20; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 40px 100px rgba(0,0,0,.55), 0 12px 30px rgba(0,0,0,.35); }
  #bar { position: relative; height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: var(--s2); border-bottom: 1px solid #293237; }
  #bar i { width: 11px; height: 11px; border-radius: 50%; background: #3b474c; }
  #url { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; align-items: center; gap: 9px; height: 28px; min-width: 460px; padding: 0 18px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: #d6dad5; font: 500 15px/1 Inter, "Noto Sans CJK SC", sans-serif; letter-spacing: .01em; }
  #shot { display: block; width: 1578px; height: 888px; background: #12191e; }
  #big { position: absolute; left: 960px; top: 400px; white-space: nowrap; font-weight: 900; line-height: 1; letter-spacing: .02em; text-shadow: 0 12px 70px rgba(0,0,0,.6); transform-origin: 50% 50%; will-change: transform, filter, opacity; }
  #big em, #end em, #exp em { font-style: normal; color: var(--soft); }
  #sticker { position: absolute; left: 56px; top: 44px; display: flex; align-items: center; gap: 14px; padding: 10px 24px 13px 17px; border-radius: 12px; background: rgba(9,13,15,.86); border: 1px solid rgba(255,255,255,.11); box-shadow: 0 14px 40px rgba(0,0,0,.45); font-weight: 700; font-size: 34px; line-height: 1.1; transform-origin: 0 50%; }
  #sticker b { width: 7px; height: 34px; border-radius: 4px; background: var(--accent); }
  /* 数值气泡:贴在被拖动的滑块上方,只盖住面板里上一行,不挡三维模型 */
  #bubble { position: absolute; left: 0; top: 0; padding: 8px 22px 10px; border-radius: 14px; background: rgba(13,18,21,.96); border: 2px solid var(--accent); box-shadow: 0 16px 44px rgba(0,0,0,.55); text-align: center; white-space: nowrap; transform-origin: 50% 100%; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 18px; height: 18px; margin-left: -9px; background: rgba(13,18,21,.96); border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); }
  #bl { font-weight: 500; font-size: 23px; color: var(--soft); }
  #bv { font: 700 52px/1.08 Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #bv small { margin-left: 8px; font: 500 24px/1 Inter, sans-serif; color: var(--muted); }
  #tag { position: absolute; left: 56px; top: 792px; padding: 11px 26px 14px; border-radius: 14px; background: rgba(9,13,15,.88); border: 1px solid rgba(255,255,255,.11); box-shadow: 0 14px 40px rgba(0,0,0,.45); transform-origin: 0 100%; }
  #tag small { display: block; font: 700 18px/1 "Liberation Mono", monospace; letter-spacing: .14em; color: var(--accent); }
  #tag span { display: flex; align-items: center; gap: 16px; margin-top: 7px; font-weight: 900; font-size: 54px; line-height: 1.1; }
  #tagdot { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
  #exp { position: absolute; left: 56px; top: 150px; padding: 22px 32px 26px; border-radius: 20px; background: rgba(9,13,15,.9); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 26px 70px rgba(0,0,0,.55); transform-origin: 0 50%; }
  #exp h2 { margin: 0; font-weight: 900; font-size: 76px; line-height: 1.1; white-space: nowrap; }
  #expfile { margin-top: 14px; font: 700 24px/1.2 "Liberation Mono", monospace; color: var(--soft); }
  #exptoast { margin-top: 6px; font-weight: 500; font-size: 25px; color: var(--muted); }
  #end { position: absolute; left: 0; top: 590px; width: 1920px; text-align: center; }
  #end h1 { margin: 0; font-weight: 900; font-size: 118px; line-height: 1.1; letter-spacing: .02em; transform-origin: 50% 50%; }
  #endrow { margin-top: 16px; display: flex; justify-content: center; align-items: center; gap: 28px; }
  #endurl { padding: 12px 32px 15px; border-radius: 999px; background: var(--accent); color: #11171a; font: 700 44px/1 Inter, sans-serif; letter-spacing: .005em; }
  #endsmall { font-weight: 500; font-size: 34px; color: var(--text); }
  /* 按下去的包装动效:贴着被按元素的一圈亮框,按下时向内收,松开后向外扩散(叠在录屏上面,不改动界面本身) */
  #press { position: absolute; left: 0; top: 0; border: 4px solid #fff; box-shadow: 0 0 0 2px rgba(232,178,138,.95), 0 0 36px rgba(232,178,138,.8), inset 0 0 26px rgba(255,255,255,.22); pointer-events: none; }
  /* 氛围层:两团缓慢漂移的柔光 + 暗角(只在示意段出现);线稿带一圈柔和辉光 */
  #amb1, #amb2 { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform; }
  #amb1 { left: 1020px; top: -330px; width: 1100px; height: 860px; background: radial-gradient(closest-side, rgba(209,141,95,.24), transparent); }
  #amb2 { left: -330px; top: 430px; width: 980px; height: 800px; background: radial-gradient(closest-side, rgba(96,134,146,.2), transparent); }
  #vig { background: radial-gradient(1500px 820px at 50% 46%, transparent 52%, rgba(4,6,7,.6) 100%); pointer-events: none; }
  #art, #a3s { filter: drop-shadow(0 0 7px rgba(224,122,60,.5)); }
  #a4s { filter: drop-shadow(0 0 4px rgba(224,122,60,.26)); }
  #bigline { position: absolute; left: 960px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, transparent, #e8b28a 30%, #fff 50%, #e8b28a 70%, transparent); }
  #flash { background: #fff; opacity: 0; pointer-events: none; }
  .head { position: absolute; left: 230px; top: 92px; font: 700 22px/1 "Liberation Mono", "Noto Sans CJK SC", monospace; letter-spacing: .2em; color: var(--accent); }
  .head span { margin-left: 18px; color: var(--muted); letter-spacing: .1em; }
  /* A2 痛点示意 */
  #a2 { transform-origin: 30% 50%; }
  #a2 .cell { position: absolute; height: 124px; border-radius: 12px; border: 2px solid var(--accent); background: rgba(209,141,95,.2); transform-origin: 0 50%; }
  #a2 .cell.late { border-color: var(--cage); background: repeating-linear-gradient(135deg, rgba(224,122,60,.38) 0 14px, rgba(224,122,60,.14) 14px 28px); }
  .lab { position: absolute; white-space: nowrap; font-weight: 900; font-size: 96px; line-height: 1; transform-origin: 0 50%; }
  .lab em { font-style: normal; color: var(--soft); }
  #stamp { position: absolute; left: 1060px; top: 196px; padding: 12px 34px 18px; border: 7px solid #e0623c; border-radius: 16px; color: #e0623c; font-weight: 900; font-size: 84px; line-height: 1.1; white-space: nowrap; transform-origin: 50% 50%; background: rgba(17,23,26,.6); }
  #sweep { position: absolute; top: 528px; width: 6px; height: 148px; border-radius: 3px; background: #fff; box-shadow: 0 0 26px rgba(255,255,255,.8); }
  #brace { position: absolute; top: 704px; height: 16px; border: 3px solid var(--cage); border-top: 0; border-radius: 0 0 12px 12px; }
  /* A3 重复的前期活儿 */
  #a3t { position: absolute; left: 230px; top: 138px; display: flex; align-items: center; gap: 26px; font-weight: 900; font-size: 92px; line-height: 1; white-space: nowrap; transform-origin: 0 50%; }
  #a3t em { font-style: normal; color: var(--soft); }
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <div id="amb1"></div><div id="amb2"></div>
    <canvas id="bgclip" class="layer" width="1920" height="948"></canvas>
    <canvas id="intro" class="layer" width="1920" height="948" style="position:absolute;left:0;top:0;width:1920px;height:948px"></canvas>
    <div id="scrim" class="layer"></div>
    <svg id="art" class="layer" viewBox="0 0 1920 948" fill="none"></svg>
    <div id="a2" class="layer">
      <div class="head" id="a2head">前期方案 · SubD 建模周期<span>示意</span></div>

      <div id="a3t"><svg id="a3loop" width="96" height="96" viewBox="-48 -48 96 96" fill="none"><path d="M30 -16 A34 34 0 1 0 34 6" stroke="#e8b28a" stroke-width="9" stroke-linecap="round"/><path d="M14 -30 L33 -17 L38 -40" stroke="#e8b28a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><span><em>重复</em>的前期活儿</span></div>
    </div>
    <div id="a4" class="layer"><svg id="a4s" class="layer" viewBox="0 0 1920 948" fill="none"></svg></div>
    <div id="cam" class="layer">
      <div id="win">
        <div id="bar"><i></i><i></i><i></i>
          <div id="url">
            <svg width="11" height="13" viewBox="0 0 11 13" fill="none"><rect x="1" y="5.5" width="9" height="6.5" rx="1.6" fill="#869296"/><path d="M3 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#869296" stroke-width="1.4"/></svg>
            <span id="urltxt"></span>
          </div>
        </div>
        <canvas id="shot" width="1440" height="810"></canvas>
      </div>
    </div>
    <div id="ov" class="layer">
      <div id="press"></div>

      <div id="bubble"><div id="bl"></div><div id="bv"></div></div>
      <div id="tag"><small id="tagn"></small><span><i id="tagdot"></i><b id="tagt" style="font-weight:900"></b></span></div>
      <div id="exp"><h2>直接导入 <em>Alias</em> / <em>犀牛</em></h2><div id="expfile"></div><div id="exptoast"></div></div>
      <div id="end"><h1 id="endh">一键导出 <em>SubD</em></h1><div id="endrow"><div id="endurl">form-cc-studio.netlify.app</div><div id="endsmall">现在免费 · 浏览器本地运行</div></div></div>
    </div>
    <div id="vig" class="layer"></div>

  </div>
  <div id="band"><div id="cap"><span id="captxt"></span></div></div>
</div>
<script src="intro.bundle.js"></script>
<script>
// 按时间取帧:seek(t) 把整页设置成 t 秒时的画面,返回后即可截图。没有任何依赖真实时间的动画。
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const eOutCubic = (u) => 1 - Math.pow(1 - u, 3);
const eInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eOutBack = (u) => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2);
const URLTXT = 'form-cc-studio.netlify.app';
const VW = 1920, VH = 948; // 画面区
const WIN = { x: 171, y: 10, w: 1578, bar: 40, h: 888 };
const K = WIN.w / 1440; // 页面 CSS 像素 → 舞台像素
const S0 = VW / WIN.w; // 这个缩放下,页面宽度正好铺满画面
const NS = 'http://www.w3.org/2000/svg';
let CFG = null;
const cache = new Map();
const HIDE = ['intro', 'bgclip', 'scrim', 'art', 'a2', 'a3', 'a4', 'cam', 'press', 'bigline', 'big', 'sticker', 'bubble', 'tag', 'exp', 'end'];
const show = (el) => { el.style.display = ''; return el; };
const hideAll = () => { for (const id of HIDE) $(id).style.display = 'none'; $('flash').style.opacity = '0'; };
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
const pstr = (pts) => pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

async function frameImg(clip, f) {
  const key = clip + ':' + f;
  let img = cache.get(key);
  if (!img) {
    img = new Image();
    img.src = CFG.framesBase + clip + '/' + String(f).padStart(5, '0') + '.jpg';
    await img.decode();
    cache.set(key, img);
    if (cache.size > 8) cache.delete(cache.keys().next().value);
  }
  return img;
}
async function drawShot(clip, f) {
  const img = await frameImg(clip, f);
  const cv = $('shot');
  if (cv.width !== img.width) { cv.width = img.width; cv.height = img.height; }
  cv.getContext('2d').drawImage(img, 0, 0); // 原始分辨率入画,只在最终合成时缩放一次
}

/* ---------- 镜头:窗口要么盖住画面区,要么居中 ---------- */
function camTransform(s, fx = 720, fy = 405) {
  const X = WIN.x + fx * K, Y = WIN.y + WIN.bar + fy * K;
  let tx = VW / 2 - s * X, ty = VH / 2 - s * Y;
  const w = WIN.w * s, h = (WIN.h + WIN.bar) * s;
  const left = WIN.x * s + tx, top = WIN.y * s + ty;
  tx += (w >= VW ? clamp(left, VW - w, 0) : (VW - w) / 2) - left;
  ty += (h >= VH ? clamp(top, VH - h, 0) : (VH - h) / 2) - top;
  return { s, tx, ty };
}
function applyCam(c, blur = 0, opacity = 1) {
  const el = show($('cam'));
  el.style.transform = `translate(${c.tx.toFixed(2)}px, ${c.ty.toFixed(2)}px) scale(${c.s.toFixed(5)})`;
  el.style.filter = blur > 0.35 ? `blur(${blur.toFixed(2)}px)` : 'none';
  el.style.opacity = String(opacity);
}
// 根据真实光标轨迹推拉:在参数面板里操作时略推近并靠右,在视口里拖拽时回到整页。前后各看 0.67 秒,镜头会提前起步。
// 逐帧取样 + 三角窗加权:缩放和位置都连续变化,不会出现隔几帧跳一下的台阶
function autoCam(rows, f, z, biasY) {
  let sz = 0, sx = 0, sy = 0, n = 0;
  for (let d = -70; d <= 70; d++) { // 第五版:前后各看约 1.2 秒(原来 0.7 秒),镜头跟得更慢更稳
    const r = rows[clamp(f + d, 0, rows.length - 1)];
    const w = 1 - Math.abs(d) / 71;
    sz += w * (r[0] > 1086 ? z[2] : r[2] ? z[1] : z[0]);
    sx += w * clamp(r[0], 250, 1300);
    sy += w * clamp(r[1], 150, 700);
    n += w;
  }
  return { s: sz / n, fx: sx / n, fy: sy / n + biasY };
}
// 关键帧镜头:相邻两个关键帧之间用缓入缓出过渡
function keyCam(keys, x) {
  if (x <= keys[0].t) return keys[0];
  for (let i = 1; i < keys.length; i++) {
    if (x <= keys[i].t) {
      const a = keys[i - 1], b = keys[i];
      const u = eInOut(seg(x, a.t, b.t));
      return { s: lerp(a.s, b.s, u), fx: lerp(a.fx, b.fx, u), fy: lerp(a.fy, b.fy, u) };
    }
  }
  return keys[keys.length - 1];
}
// 按压曲线:按下时很快到 1,松开后带一点回弹地回到 0
function pressBump(u, hold) {
  if (u < 0) return 0;
  return eOutCubic(seg(u, 0, 0.06)) * (1 - eOutBack(seg(u, hold + 0.02, hold + 0.42)));
}
function url(p) {
  const n = Math.round(clamp(p) * URLTXT.length);
  $('urltxt').textContent = URLTXT.slice(0, n) + (p > 0 && p < 1 ? '|' : '');
}
function flash(o) { $('flash').style.opacity = String(clamp(o)); }

/* ---------- 包装元素 ---------- */
function setBig(html, size, y) {
  const el = show($('big'));
  if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
  el.style.fontSize = size + 'px';
  el.style.top = y + 'px';
  return el;
}
function bigText(html, size, y, u, dur) {
  // 精修后的大字入场:自下而上浮起、字距由松到紧、模糊衰减,下方一道光线横向展开;离场时向上淡出
  const el = setBig(html, size, y);
  const a = eOutExpo(seg(u, 0, 0.5));
  const out = eInOut(seg(u, dur - 0.16, dur));
  el.style.opacity = String(clamp(a * 1.5) * (1 - out));
  el.style.letterSpacing = (0.02 + 0.1 * (1 - a)).toFixed(3) + 'em';
  el.style.transform = `translate(-50%, -50%) translate(0, ${((1 - a) * 46 - out * 30).toFixed(1)}px) scale(${(1 + 0.035 * seg(u, 0, dur)).toFixed(4)})`;
  const blur = (1 - a) * 16 + out * 10;
  el.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  const ln = show($('bigline')), w = size * 2.4 * eOutCubic(seg(u, 0.1, 0.75));
  ln.style.width = w.toFixed(0) + 'px'; ln.style.marginLeft = (-w / 2).toFixed(0) + 'px';
  ln.style.top = (y + size * 0.74) + 'px'; ln.style.opacity = String(0.9 * seg(u, 0.1, 0.3) * (1 - out));
}
function slam(el, age, origin) {
  const a = eOutExpo(seg(age, 0, 0.42));
  el.style.opacity = String(clamp(a * 1.5));
  el.style.transform = `translate(0, ${((1 - a) * 18).toFixed(1)}px) scale(${(1.1 - 0.1 * a).toFixed(3)})`;
  el.style.filter = a < 0.985 ? `blur(${((1 - a) * 10).toFixed(1)}px)` : 'none';
  if (origin) el.style.transformOrigin = origin;
}
function sticker(text, age) {
  if (!text || age < 0) return;
  const el = show($('sticker'));
  $('stickertxt').textContent = text;
  const a = eOutExpo(seg(age, 0, 0.3));
  el.style.opacity = String(clamp(a * 1.6));
  el.style.transform = `translate(${((1 - a) * -46).toFixed(1)}px, 0) scale(${(1.28 - 0.28 * a).toFixed(3)})`;
  el.style.filter = a < 0.985 ? `blur(${((1 - a) * 11).toFixed(1)}px)` : 'none';
}
// 数值气泡:参数名、数值、单位都来自录制时逐帧读回的真实输入框
function bubble(rows, f, c) {
  const b = rows[f] && rows[f][3];
  if (!b) return;
  let a = f, z = f;
  while (a > 0 && rows[a - 1][3] && rows[a - 1][3].l === b.l) a--;
  while (z < rows.length - 1 && rows[z + 1][3] && rows[z + 1][3].l === b.l) z++;
  const inn = eOutBack(seg((f - a) / 60, 0, 0.24));
  const out = seg((z - f) / 60, 0, 0.1);
  let fresh = 0;

function locate(shot, lt) {
  let lf = Math.max(0, Math.round(lt * 60));
  for (let i = 0; i < shot.parts.length; i++) {
    const p = shot.parts[i];
    if (lf < p.frames || i === shot.parts.length - 1) return { clip: p.clip, f: p.from + Math.min(lf, p.frames - 1), part: i, lf, held: lf >= p.frames };
    lf -= p.frames;
  }
}
async function realShot(lt, shot, z) {
  const dur = shot.end - shot.start;
  const L = locate(shot, lt);
  await drawShot(L.clip, L.f);
  const camAt = (x) => {
    const q = locate(shot, x);
    const a = autoCam(CFG.clips[q.clip].rows, q.f, z, shot.biasY || 0);
    const punch = 1 + 0.018 * (1 - eOutExpo(seg(x, 0, 0.6))); // 第五版:切镜时的"冲一下"收小,录屏段之间更平
    const tail = shot.total / 60 < dur ? 0.03 * eInOut(seg(x, shot.total / 60, dur)) : 0; // 素材放完后缓慢推近,避免静帧
    return camTransform(a.s * punch + tail, a.fx, a.fy);
  };
  const c = camAt(lt), p = camAt(Math.max(0, lt - 1 / 60));
  const v = Math.hypot(c.tx - p.tx, c.ty - p.ty) + Math.abs(c.s - p.s) * 1100; // 运动模糊随镜头速度变化
  applyCam(c, clamp(v * 0.2, 0, 7) + (1 - eOutExpo(seg(lt, 0, 0.3))) * 3, 1);
  url(1);
  const st = (shot.stickers || []).filter((s) => s.t <= lt).pop();
  if (st) sticker(st.text, lt - st.t);
  return { ...L, c, rows: CFG.clips[L.clip].rows };
}

  if (o > 0.004) {
    const cv = drawIntroAt(shot.start);
    const p = eOutCubic(seg(lt, 0, 0.6));
    cv.style.opacity = String(o);
    cv.style.transformOrigin = '1410px 592px';
    cv.style.transform = `translate(${(-647 * p).toFixed(1)}px, ${(-27 * p).toFixed(1)}px) scale(${(1 + 0.16 * p).toFixed(4)})`;
    cv.style.filter = p > 0.05 ? `blur(${(6 * p).toFixed(1)}px)` : 'none';
  }
  if (lt < 1.3) {
    const el = setBig('所以，我做了<em>这个网站</em>', 124, 250); // 大字放在上方,不挡住正在对位的那台车
    const inn = eOutExpo(seg(lt, 0.05, 0.36));
    const p = eInOut(seg(lt, 0.85, 1.3));
    el.style.opacity = String(clamp(inn * 1.8) * (1 - p));
    el.style.transform = `translate(-50%, -50%) translate(0, ${(-230 * p).toFixed(1)}px) scale(${((1.22 - 0.22 * inn) * lerp(1, 0.1, p)).toFixed(4)})`;
    const blur = (1 - inn) * 12 + p * 9;
    el.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  }
  url(seg(lt, 1.3, 2.0));
  const st = (shot.stickers || []).filter((s) => s.t <= lt).pop();
  if (st) sticker(st.text, lt - st.t);
};

window.init = async (cfg) => {
  CFG = cfg;
  if (cfg.scale && cfg.scale !== 1) document.documentElement.style.zoom = String(cfg.scale);
  buildArt();
  buildA2();
  buildA3();
  buildA4();
  await Promise.all(['900 220px "Noto Sans CJK SC"', '700 44px "Noto Sans CJK SC"', '500 44px "Noto Sans CJK SC"', '700 52px Inter', '500 15px Inter', '700 20px "Liberation Mono"'].map((f) => document.fonts.load(f, '汽车造型 SubD 0123456789')));
  await document.fonts.ready;
  return true;
};
window.seek = async (t) => {
  const S = CFG.shots;
  let shot = S[S.length - 1];
  for (const s of S) if (t >= s.start && t < s.end) { shot = s; break; }
  hideAll();
  for (const id of ['a2', 'a3', 'a4', 'art']) { $(id).style.opacity = ''; $(id).style.translate = ''; }
  await R[shot.id](t - shot.start, shot);
  // 氛围光缓慢漂移;示意段之间不再硬切加白闪,而是整幅内容浮入、上移淡出
  $('vig').style.display = 'none';
  $('amb1').style.transform = `translate(${(70 * Math.sin(t * 0.33)).toFixed(1)}px, ${(46 * Math.cos(t * 0.27)).toFixed(1)}px)`;
  $('amb2').style.transform = `translate(${(80 * Math.cos(t * 0.29)).toFixed(1)}px, ${(-40 * Math.sin(t * 0.23)).toFixed(1)}px)`;
  if (false) {
    const lt = t - shot.start, d = shot.end - shot.start;
    const i = eOutCubic(seg(lt, 0, 0.5)), o = eInOut(seg(lt, d - 0.3, d));
    for (const id of [shot.id.toLowerCase(), 'art']) { $(id).style.opacity = String(i * (1 - o)); $(id).style.translate = `0 ${((1 - i) * 28 - o * 20).toFixed(1)}px`; }
  }
  caption(t);
  return shot.id;
};
</script>
